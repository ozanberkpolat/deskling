name: Test and release

# Every push and pull request runs the unit tests. A tag like v1.2.3 (or "Run workflow" by hand)
# also builds deskling-setup.exe on Windows and runs scripts/windows-smoke.ps1 against it on a
# fresh runner: upgrade from cc-dog, hooks, the first-start question, uninstall. Only a tag whose
# smoke test passed is published, under the fixed name deskling-setup.exe, so
# releases/latest/download/deskling-setup.exe always points at the newest one.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1     # the tests never start Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { (node -p "require('./package.json').version") }
          node scripts/make-icon.mjs
          npx @electron/packager . deskling --platform=win32 --arch=x64 --asar --out=dist --overwrite `
            --app-version=$version --icon=build/icon.ico `
            --ignore='^/(fixtures|test|scripts|dist|build|docs|videos|installer|preview(-settings)?\.html|\.github)($|/)'
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
          Push-Location installer
          & 'C:\Program Files (x86)\NSIS\makensis.exe' -V2 "-DVERSION=$version" deskling.nsi
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
      - uses: actions/upload-artifact@v4
        with:
          name: deskling-setup
          path: dist/deskling-setup.exe
      - name: Microsoft Store package (unsigned; the Store signs it)
        shell: pwsh
        run: |
          $env:DESKLING_VERSION = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '' }
          node scripts/make-msix.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64' -Directory | Sort-Object Name | Select-Object -Last 1
          & (Join-Path $sdk.FullName 'makeappx.exe') pack /d dist\msix /p dist\deskling.msix /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: deskling-msix
          path: dist/deskling.msix

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deskling-setup
      - name: Install, upgrade, hooks, first start, uninstall
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Installer ./deskling-setup.exe -Out smoke
      - name: Keep the app's log, also when a check failed
        if: always()
        shell: pwsh
        run: New-Item -ItemType Directory -Force smoke | Out-Null; Copy-Item "$env:APPDATA\deskling\deskling.log*" smoke -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke/

  smoke-msix:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deskling-msix
      - name: Install the Store package, first start, hooks, uninstall
        shell: pwsh
        run: ./scripts/windows-smoke-msix.ps1 -Package ./deskling.msix -Publisher 'CN=CE54EF76-5C7E-4E9A-99C3-9CD72C74D9E7' -Out smoke-msix
      - name: Keep the app's log, also when a check failed
        if: always()
        shell: pwsh
        run: New-Item -ItemType Directory -Force smoke-msix | Out-Null; Copy-Item "$env:LOCALAPPDATA\Packages\OzanBerkPolat.DesklingDeskBuddy_*\LocalCache\Roaming\deskling\deskling.log*" smoke-msix -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-msix-results
          path: smoke-msix/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, smoke-msix]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deskling-setup
      - uses: actions/download-artifact@v4
        with:
          name: deskling-msix
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # deskling-store.msix is unsigned: it is only for the Microsoft Store submission (the Store signs it)
        run: |
          mv deskling.msix deskling-store.msix
          gh release create '${{ github.ref_name }}' deskling-setup.exe deskling-store.msix --repo '${{ github.repository }}' --title "Deskling ${{ github.ref_name }}" --generate-notes `
            --notes "Install: [Microsoft Store](https://apps.microsoft.com/detail/9nnsg351d4bq) or deskling-setup.exe. deskling-store.msix is the unsigned package for the Store submission, not for installing."

