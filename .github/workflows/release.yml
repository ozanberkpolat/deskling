name: Test and release

# Every push and pull request runs the unit tests. A tag like v1.2.3 (or "Run workflow" by hand)
# also builds deskling-setup.exe on Windows and runs scripts/windows-smoke.ps1 against it on a
# fresh runner: upgrade from cc-dog, hooks, the first-start question, uninstall. Only a tag whose
# smoke test passed is published, under the fixed name deskling-setup.exe, so
# releases/latest/download/deskling-setup.exe always points at the newest one.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1     # the tests never start Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_name }}' -like 'v*') { '${{ github.ref_name }}'.TrimStart('v') } else { (node -p "require('./package.json').version") }
          node scripts/make-icon.mjs
          npx @electron/packager . deskling --platform=win32 --arch=x64 --asar --out=dist --overwrite `
            --app-version=$version --icon=build/icon.ico `
            --ignore='^/(fixtures|test|scripts|dist|build|docs|videos|installer|preview\.html|\.github)($|/)'
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
          Push-Location installer
          & 'C:\Program Files (x86)\NSIS\makensis.exe' -V2 "-DVERSION=$version" deskling.nsi
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
      - uses: actions/upload-artifact@v4
        with:
          name: deskling-setup
          path: dist/deskling-setup.exe

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deskling-setup
      - name: Install, upgrade, hooks, first start, uninstall
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Installer ./deskling-setup.exe -Out smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deskling-setup
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' deskling-setup.exe --repo '${{ github.repository }}' --title "Deskling ${{ github.ref_name }}" --generate-notes
